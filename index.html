<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<title>Morning Routine StandBy</title>
<style>
  :root {
    --bg: #d7e3d4;
    --card: rgba(255, 255, 255, 0.45);
    --card-border: rgba(26, 46, 34, 0.10);
    --text: #1a2e22;
    --muted: rgba(26, 46, 34, 0.62);
    --pill: rgba(26, 46, 34, 0.08);
    --pill-hover: rgba(26, 46, 34, 0.14);
    --accent: #2d5a3f;
    --accent-text: #ffffff;
    --active-bg: rgba(220, 38, 38, 0.12);
    --active-bar: #dc2626;
    --done-text: rgba(26, 46, 34, 0.38);
  }

  body.theme-sand {
    --bg: #ebe3d5;
    --card: rgba(255, 255, 255, 0.5);
    --card-border: rgba(58, 46, 34, 0.1);
    --text: #3a2e22;
    --muted: rgba(58, 46, 34, 0.62);
    --pill: rgba(58, 46, 34, 0.08);
    --pill-hover: rgba(58, 46, 34, 0.14);
    --accent: #7a5c3e;
    --accent-text: #ffffff;
  }

  body.theme-sky {
    --bg: #d6e4ee;
    --card: rgba(255, 255, 255, 0.5);
    --card-border: rgba(24, 46, 64, 0.1);
    --text: #182e40;
    --muted: rgba(24, 46, 64, 0.62);
    --pill: rgba(24, 46, 64, 0.08);
    --pill-hover: rgba(24, 46, 64, 0.14);
    --accent: #255378;
    --accent-text: #ffffff;
  }

  body.theme-dark {
    --bg: #121614;
    --card: rgba(255, 255, 255, 0.06);
    --card-border: rgba(255, 255, 255, 0.10);
    --text: #e6efe9;
    --muted: rgba(230, 239, 233, 0.58);
    --pill: rgba(255, 255, 255, 0.10);
    --pill-hover: rgba(255, 255, 255, 0.16);
    --accent: #6bbf8a;
    --accent-text: #0f1a13;
    --active-bg: rgba(239, 68, 68, 0.22);
    --active-bar: #f87171;
    --done-text: rgba(230, 239, 233, 0.34);
  }

  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
    margin: 0;
    padding: 0;
  }

  html, body {
    height: 100%;
    width: 100%;
    overflow: hidden;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang HK", "Noto Sans TC", sans-serif;
    transition: background 0.35s ease, color 0.35s ease;
    user-select: none;
  }

  .app {
    height: 100dvh;
    width: 100%;
    padding: max(10px, env(safe-area-inset-top)) max(14px, env(safe-area-inset-right)) max(10px, env(safe-area-inset-bottom)) max(14px, env(safe-area-inset-left));
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  /* Top Control Bar */
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
    flex-shrink: 0;
  }

  .topbar-group {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
  }

  .chip {
    background: var(--pill);
    border: 1px solid var(--card-border);
    color: var(--text);
    border-radius: 999px;
    padding: 5px 10px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    transition: background 0.2s;
  }

  .chip:active {
    background: var(--pill-hover);
  }

  .chip.active {
    background: var(--accent);
    color: var(--accent-text);
    border-color: transparent;
  }

  .chip.wake-on {
    background: rgba(34, 197, 94, 0.16);
    border-color: rgba(34, 197, 94, 0.35);
  }

  /* Main Split Grid (iPad Landscape) */
  .main-grid {
    flex: 1;
    min-height: 0;
    display: grid;
    grid-template-columns: 36% 1fr;
    gap: 12px;
  }

  .panel {
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 22px;
    padding: 14px 16px;
    display: flex;
    flex-direction: column;
    min-height: 0;
  }

  /* Left Panel: Clock + Current Focus */
  .left-panel {
    justify-content: space-between;
  }

  .date-line {
    font-size: 14px;
    font-weight: 600;
    color: var(--muted);
    letter-spacing: 0.3px;
  }

  .clock-big {
    font-size: clamp(38px, 6vw, 68px);
    font-weight: 700;
    line-height: 1.02;
    letter-spacing: -1.5px;
    font-variant-numeric: tabular-nums;
    margin-top: 2px;
  }

  .clock-sec {
    font-size: 0.42em;
    font-weight: 600;
    color: var(--muted);
    margin-left: 4px;
  }

  .focus-box {
    background: var(--pill);
    border-radius: 16px;
    padding: 12px 14px;
    margin: 8px 0;
  }

  .focus-label {
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.6px;
    color: var(--muted);
  }

  .focus-title {
    font-size: clamp(18px, 2.4vw, 24px);
    font-weight: 700;
    margin-top: 3px;
    line-height: 1.25;
  }

  .focus-timer {
    font-size: clamp(22px, 3vw, 32px);
    font-weight: 700;
    color: var(--active-bar);
    font-variant-numeric: tabular-nums;
    margin-top: 4px;
  }

  .time-anchors {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .anchor-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--pill);
    border-radius: 12px;
    padding: 7px 11px;
  }

  .anchor-label {
    font-size: 13px;
    font-weight: 600;
  }

  .time-input-pill {
    background: var(--card);
    border: 1px solid var(--card-border);
    color: var(--text);
    border-radius: 8px;
    padding: 3px 8px;
    font-size: 14px;
    font-weight: 700;
    font-family: inherit;
    font-variant-numeric: tabular-nums;
  }

  .quick-actions {
    display: flex;
    gap: 6px;
    margin-top: 6px;
  }

  .quick-actions .chip {
    flex: 1;
    justify-content: center;
    padding: 7px 8px;
  }

  /* Right Panel: Lists + Schedule Table */
  .right-panel {
    justify-content: space-between;
  }

  .list-tabs {
    display: flex;
    align-items: center;
    gap: 6px;
    overflow-x: auto;
    padding-bottom: 6px;
    flex-shrink: 0;
    scrollbar-width: none;
  }
  .list-tabs::-webkit-scrollbar { display: none; }

  .table-header {
    display: grid;
    grid-template-columns: 1fr 52px 78px;
    font-size: 11px;
    font-weight: 700;
    color: var(--muted);
    padding: 4px 10px;
    border-bottom: 1px solid var(--card-border);
    flex-shrink: 0;
  }
  .table-header span:nth-child(2),
  .table-header span:nth-child(3) {
    text-align: right;
  }

  .schedule-list {
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 4px 0;
  }

  .task-row {
    display: grid;
    grid-template-columns: 1fr 52px 78px;
    align-items: center;
    padding: 0 10px;
    border-radius: 8px;
    border-left: 4px solid transparent;
    font-size: 14px;
    font-weight: 500;
    flex: 1;
    min-height: 0;
    cursor: pointer;
    transition: background 0.2s;
  }

  .task-row.done {
    color: var(--done-text);
  }

  .task-row.active {
    background: var(--active-bg);
    border-left-color: var(--active-bar);
    font-weight: 700;
  }

  .task-name {
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    padding-right: 6px;
  }

  .task-mins, .task-start {
    text-align: right;
    font-variant-numeric: tabular-nums;
  }

  .task-mins {
    color: var(--muted);
    font-size: 13px;
  }

  .leave-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding-top: 6px;
    border-top: 1px solid var(--card-border);
    flex-shrink: 0;
  }

  .leave-label {
    font-size: 14px;
    font-weight: 700;
  }

  /* iPhone Portrait Single-Screen Compact Adaptation */
  @media (max-width: 767px) {
    .app {
      padding: max(6px, env(safe-area-inset-top)) 10px max(8px, env(safe-area-inset-bottom)) 10px;
      gap: 5px;
    }

    .chip {
      padding: 4px 8px;
      font-size: 11px;
    }

    .main-grid {
      grid-template-columns: 1fr;
      grid-template-rows: auto 1fr;
      gap: 6px;
    }

    .panel {
      border-radius: 16px;
      padding: 8px 12px;
    }

    .left-panel {
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: auto auto;
      gap: 6px 10px;
      align-items: center;
    }

    .clock-wrap {
      grid-column: 1;
      grid-row: 1;
    }

    .date-line { font-size: 11px; }
    .clock-big { font-size: 28px; letter-spacing: -0.8px; }

    .focus-box {
      grid-column: 2;
      grid-row: 1;
      margin: 0;
      padding: 6px 10px;
      border-radius: 12px;
    }
    .focus-label { font-size: 9px; }
    .focus-title { font-size: 14px; }
    .focus-timer { font-size: 16px; margin-top: 1px; }

    .time-anchors {
      grid-column: 1 / -1;
      grid-row: 2;
      flex-direction: row;
      align-items: center;
      gap: 6px;
    }

    .anchor-row {
      flex: 1;
      padding: 4px 8px;
      border-radius: 10px;
    }
    .anchor-label { font-size: 11px; }
    .time-input-pill { font-size: 12px; padding: 2px 5px; }

    .quick-actions {
      margin-top: 0;
      flex: 1;
    }
    .quick-actions .chip {
      padding: 5px 6px;
      font-size: 11px;
    }

    .table-header {
      padding: 2px 6px;
      font-size: 10px;
    }

    .task-row {
      padding: 0 6px;
      font-size: 12.5px;
      border-left-width: 3px;
    }

    .task-mins { font-size: 11.5px; }

    .leave-footer {
      padding-top: 4px;
    }
    .leave-label { font-size: 13px; }
  }

  /* Modal Editor */
  .modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.45);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 16px;
    z-index: 50;
  }
  .modal-backdrop.open { display: flex; }

  .modal {
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--card-border);
    border-radius: 20px;
    width: 100%;
    max-width: 460px;
    max-height: 85dvh;
    display: flex;
    flex-direction: column;
    padding: 16px;
    gap: 10px;
    box-shadow: 0 20px 40px rgba(0,0,0,0.25);
  }

  .modal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-weight: 700;
    font-size: 16px;
  }

  .modal-body {
    flex: 1;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .edit-row {
    display: grid;
    grid-template-columns: 1fr 64px 28px 28px 28px;
    gap: 4px;
    align-items: center;
  }

  .edit-input {
    background: var(--card);
    border: 1px solid var(--card-border);
    color: var(--text);
    border-radius: 8px;
    padding: 6px 8px;
    font-size: 13px;
    font-family: inherit;
    width: 100%;
  }

  .icon-btn {
    background: var(--pill);
    border: none;
    color: var(--text);
    border-radius: 6px;
    height: 28px;
    cursor: pointer;
    font-size: 12px;
    font-weight: 700;
  }
</style>
</head>
<body>
<div class="app" id="appRoot">
  <!-- Top Bar -->
  <div class="topbar">
    <div class="topbar-group">
      <button class="chip wake-on" id="wakeBtn" onclick="enableWakeLock(true)">🔆 螢幕常亮中</button>
      <button class="chip active" id="voiceBtn" onclick="toggleVoice()">🔊 粵語提示: 開</button>
      <button class="chip" onclick="testVoice()">🔔 試聽</button>
    </div>
    <div class="topbar-group">
      <button class="chip" onclick="cycleTheme()">🎨 主題</button>
    </div>
  </div>

  <!-- Main Grid -->
  <div class="main-grid">
    <!-- Left Panel: Clock + Focus + Wake Anchor -->
    <div class="panel left-panel">
      <div class="clock-wrap">
        <div class="date-line" id="dateDisplay">--</div>
        <div class="clock-big" id="clockDisplay">00:00<span class="clock-sec">00</span></div>
      </div>

      <div class="focus-box">
        <div class="focus-label" id="focusStatus">目前進度</div>
        <div class="focus-title" id="focusTaskName">準備開始</div>
        <div class="focus-timer" id="focusCountdown">--:--</div>
      </div>

      <div class="time-anchors">
        <div class="anchor-row">
          <span class="anchor-label">起床時間</span>
          <input type="time" id="wakeTimeInput" class="time-input-pill" onchange="onWakeTimeChange()" />
        </div>
        <div class="quick-actions">
          <button class="chip" onclick="startNow()">▶ 立即開始</button>
          <button class="chip" onclick="runDemo()">⚡ 預覽</button>
        </div>
      </div>
    </div>

    <!-- Right Panel: Lists + Schedule + Leave Time -->
    <div class="panel right-panel">
      <div class="list-tabs" id="listTabs"></div>

      <div class="table-header">
        <span>項目</span>
        <span>Mins</span>
        <span>計劃開始</span>
      </div>

      <div class="schedule-list" id="scheduleList"></div>

      <div class="leave-footer">
        <span class="leave-label">出門時間 <span id="totalMinsBadge" style="font-size:12px;color:var(--muted);font-weight:500;"></span></span>
        <input type="time" id="leaveTimeInput" class="time-input-pill" onchange="onLeaveTimeChange()" />
      </div>
    </div>
  </div>
</div>

<!-- Edit Modal -->
<div class="modal-backdrop" id="editorModal">
  <div class="modal">
    <div class="modal-header">
      <span>編輯清單</span>
      <button class="chip" onclick="closeEditor()">✕ 關閉</button>
    </div>
    <div style="display:flex;gap:6px;">
      <input type="text" id="listNameInput" class="edit-input" placeholder="清單名稱" />
      <button class="chip" onclick="deleteCurrentList()" style="color:#dc2626;">🗑 刪除清單</button>
    </div>
    <div class="modal-body" id="editorRows"></div>
    <div style="display:flex;gap:8px;justify-content:space-between;">
      <button class="chip" onclick="addEditorStep()">+ 新增項目</button>
      <button class="chip active" onclick="saveEditor()">✓ 儲存變更</button>
    </div>
  </div>
</div>

<script>
  const DEFAULT_LISTS = [
    {
      id: 'weekday',
      name: '平日',
      wakeMins: 23 * 60, // 11:00 PM
      tasks: [
        { name: '小便', mins: 3 },
        { name: '刷牙', mins: 3 },
        { name: '洗面', mins: 2 },
        { name: '磅重 + Apple Watch 充電', mins: 2 },
        { name: '面部保養 / 梳頭', mins: 3 },
        { name: '選擇衣服', mins: 3 },
        { name: '吃早餐', mins: 15 },
        { name: '著衣服', mins: 4 },
        { name: '執袋', mins: 4 },
        { name: '著鞋', mins: 3 }
      ]
    },
    {
      id: 'weekend',
      name: '週末',
      wakeMins: 9 * 60, // 09:00 AM
      tasks: [
        { name: '小便 + 磅重', mins: 3 },
        { name: '刷牙洗面', mins: 5 },
        { name: '面部保養', mins: 4 },
        { name: '慢享早餐 + 咖啡', mins: 25 },
        { name: '換運動/外出服', mins: 5 },
        { name: '執袋 + 著鞋', mins: 5 }
      ]
    }
  ];

  const THEMES = ['', 'theme-sand', 'theme-sky', 'theme-dark'];
  let state = {
    lists: JSON.parse(localStorage.getItem('routine_lists_v2')) || DEFAULT_LISTS,
    activeListId: localStorage.getItem('routine_active_id_v2') || 'weekday',
    themeIdx: Number(localStorage.getItem('routine_theme_v2') || 0),
    voiceEnabled: localStorage.getItem('routine_voice_v2') === null ? true : localStorage.getItem('routine_voice_v2') === 'true',
    lastAnnouncedKey: null,
    demoOffsetSec: null
  };

  let wakeLock = null;
  let silentAudioCtx = null;

  function saveState() {
    localStorage.setItem('routine_lists_v2', JSON.stringify(state.lists));
    localStorage.setItem('routine_active_id_v2', state.activeListId);
    localStorage.setItem('routine_theme_v2', state.themeIdx);
    localStorage.setItem('routine_voice_v2', state.voiceEnabled);
  }

  function getActiveList() {
    return state.lists.find(l => l.id === state.activeListId) || state.lists[0];
  }

  /* --- Keep iPhone Screen Awake --- */
  async function enableWakeLock(manualClick = false) {
    const btn = document.getElementById('wakeBtn');
    try {
      if ('wakeLock' in navigator) {
        wakeLock = await navigator.wakeLock.request('screen');
        btn.textContent = '🔆 螢幕常亮中';
        btn.classList.add('wake-on');
        wakeLock.addEventListener('release', () => {
          btn.textContent = '🔅 點擊保持常亮';
          btn.classList.remove('wake-on');
        });
      }
    } catch (e) {
      btn.textContent = '🔅 點擊保持常亮';
      btn.classList.remove('wake-on');
    }

    // Also unlock WebAudio on user gesture so announcements & keep-alive work reliably on iOS
    if (manualClick) {
      initSilentAudio();
      if (state.voiceEnabled && window.speechSynthesis) {
        const u = new SpeechSynthesisUtterance('');
        window.speechSynthesis.speak(u);
      }
    }
  }

  function initSilentAudio() {
    try {
      if (!silentAudioCtx) {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        silentAudioCtx = new AudioContext();
      }
      if (silentAudioCtx.state === 'suspended') {
        silentAudioCtx.resume();
      }
    } catch (e) {}
  }

  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') {
      enableWakeLock(false);
    }
  });

  // Automatically engage audio/wake lock on first tap anywhere on screen
  document.addEventListener('touchstart', () => enableWakeLock(true), { once: true });
  document.addEventListener('click', () => enableWakeLock(true), { once: true });

  /* --- Time Helpers --- */
  function minsToInputVal(totalMins) {
    const m = ((totalMins % 1440) + 1440) % 1440;
    const hh = String(Math.floor(m / 60)).padStart(2, '0');
    const mm = String(m % 60).padStart(2, '0');
    return `${hh}:${mm}`;
  }

  function inputValToMins(val) {
    if (!val) return 0;
    const [h, m] = val.split(':').map(Number);
    return h * 60 + m;
  }

  function format12Hour(totalMins) {
    const m = ((totalMins % 1440) + 1440) % 1440;
    let h = Math.floor(m / 60);
    const min = String(m % 60).padStart(2, '0');
    const ampm = h >= 12 ? 'PM' : 'AM';
    h = h % 12 || 12;
    return `${h}:${min} ${ampm}`;
  }

  function getTotalMins(list) {
    return list.tasks.reduce((sum, t) => sum + Number(t.mins || 0), 0);
  }

  /* --- Bidirectional Time Calculation --- */
  function onWakeTimeChange() {
    state.demoOffsetSec = null;
    state.lastAnnouncedKey = null;
    const list = getActiveList();
    list.wakeMins = inputValToMins(document.getElementById('wakeTimeInput').value);
    saveState();
    renderAll();
  }

  function onLeaveTimeChange() {
    state.demoOffsetSec = null;
    state.lastAnnouncedKey = null;
    const list = getActiveList();
    const leaveMins = inputValToMins(document.getElementById('leaveTimeInput').value);
    const total = getTotalMins(list);
    list.wakeMins = ((leaveMins - total) % 1440 + 1440) % 1440;
    saveState();
    renderAll();
  }

  function startNow() {
    state.demoOffsetSec = null;
    state.lastAnnouncedKey = null;
    const now = new Date();
    const list = getActiveList();
    list.wakeMins = now.getHours() * 60 + now.getMinutes();
    saveState();
    renderAll();
    if (list.tasks.length > 0) {
      announceTask(list.tasks[0].name, list.tasks[0].mins);
    }
  }

  function runDemo() {
    const list = getActiveList();
    // Jump ~11 mins in so item 5 (or mid-list) is highlighted
    state.demoOffsetSec = 10 * 60 + 20;
    state.lastAnnouncedKey = null;
    renderAll();
  }

  /* --- Chime & Cantonese Speech (No "預備", just minutes) --- */
  function playChime() {
    try {
      initSilentAudio();
      const ctx = silentAudioCtx;
      if (!ctx) return;
      const now = ctx.currentTime;
      [587.33, 880].forEach((freq, i) => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, now + i * 0.16);
        gain.gain.setValueAtTime(0.18, now + i * 0.16);
        gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.16 + 0.45);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now + i * 0.16);
        osc.stop(now + i * 0.16 + 0.45);
      });
    } catch (e) {}
  }

  function speakCantonese(text) {
    if (!state.voiceEnabled || !('speechSynthesis' in window)) return;
    window.speechSynthesis.cancel();
    const utter = new SpeechSynthesisUtterance(text);
    utter.lang = 'zh-HK';
    utter.rate = 1.02;
    const voices = window.speechSynthesis.getVoices();
    const hkVoice = voices.find(v => v.lang.includes('zh-HK') || v.lang.includes('yue'));
    if (hkVoice) utter.voice = hkVoice;
    window.speechSynthesis.speak(utter);
  }

  function announceTask(name, mins) {
    if (!state.voiceEnabled) return;
    playChime();
    const cleanName = name.replace(/\//g, '同埋').replace(/\+/g, '同埋');
    setTimeout(() => {
      speakCantonese(`下一個項目：${cleanName}，${mins} 分鐘。`);
    }, 350);
  }

  function announceLeave() {
    if (!state.voiceEnabled) return;
    playChime();
    setTimeout(() => {
      speakCantonese('夠鐘出門啦！');
    }, 350);
  }

  function toggleVoice() {
    state.voiceEnabled = !state.voiceEnabled;
    saveState();
    updateVoiceButton();
    if (state.voiceEnabled) {
      playChime();
      speakCantonese('粵語語音提示已開啟。');
    }
  }

  function testVoice() {
    const list = getActiveList();
    const sample = list.tasks[0] || { name: '刷牙', mins: 3 };
    playChime();
    const cleanName = sample.name.replace(/\//g, '同埋').replace(/\+/g, '同埋');
    setTimeout(() => {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utter = new SpeechSynthesisUtterance(`下一個項目：${cleanName}，${sample.mins} 分鐘。`);
        utter.lang = 'zh-HK';
        window.speechSynthesis.speak(utter);
      }
    }, 350);
  }

  function updateVoiceButton() {
    const btn = document.getElementById('voiceBtn');
    if (state.voiceEnabled) {
      btn.textContent = '🔊 粵語提示: 開';
      btn.classList.add('active');
    } else {
      btn.textContent = '🔇 粵語提示: 關';
      btn.classList.remove('active');
    }
  }

  /* --- Theme --- */
  function cycleTheme() {
    state.themeIdx = (state.themeIdx + 1) % THEMES.length;
    saveState();
    applyTheme();
  }

  function applyTheme() {
    document.body.className = THEMES[state.themeIdx];
  }

  /* --- Render Tabs & Schedule --- */
  function renderTabs() {
    const container = document.getElementById('listTabs');
    container.innerHTML = '';
    state.lists.forEach(list => {
      const btn = document.createElement('button');
      btn.className = 'chip' + (list.id === state.activeListId ? ' active' : '');
      btn.textContent = list.name;
      btn.onclick = () => {
        state.activeListId = list.id;
        state.demoOffsetSec = null;
        state.lastAnnouncedKey = null;
        saveState();
        renderAll();
      };
      container.appendChild(btn);
    });

    const addBtn = document.createElement('button');
    addBtn.className = 'chip';
    addBtn.textContent = '+ 新增';
    addBtn.onclick = createNewList;
    container.appendChild(addBtn);

    const editBtn = document.createElement('button');
    editBtn.className = 'chip';
    editBtn.textContent = '✏️ 編輯';
    editBtn.onclick = openEditor;
    container.appendChild(editBtn);
  }

  function renderAll() {
    const list = getActiveList();
    const totalMins = getTotalMins(list);
    const leaveMins = (list.wakeMins + totalMins) % 1440;

    document.getElementById('wakeTimeInput').value = minsToInputVal(list.wakeMins);
    document.getElementById('leaveTimeInput').value = minsToInputVal(leaveMins);
    document.getElementById('totalMinsBadge').textContent = `(共 ${totalMins} 分鐘)`;

    renderTabs();
    tick();
  }

  function tick() {
    const now = new Date();
    const days = ['週日', '週一', '週二', '週三', '週四', '週五', '週六'];
    document.getElementById('dateDisplay').textContent =
      `${now.getMonth() + 1}月${now.getDate()}日 ${days[now.getDay()]}`;

    const hh = String(now.getHours()).padStart(2, '0');
    const mm = String(now.getMinutes()).padStart(2, '0');
    const ss = String(now.getSeconds()).padStart(2, '0');
    document.getElementById('clockDisplay').innerHTML = `${hh}:${mm}<span class="clock-sec">${ss}</span>`;

    const list = getActiveList();
    const wakeSec = list.wakeMins * 60;
    const nowSec = now.getHours() * 3600 + now.getMinutes() * 60 + now.getSeconds();

    let elapsedSec;
    if (state.demoOffsetSec !== null) {
      elapsedSec = state.demoOffsetSec;
    } else {
      // Handle overnight wrap smoothly (e.g. 11:00 PM -> 11:42 PM or across midnight)
      elapsedSec = nowSec - wakeSec;
      if (elapsedSec < -12 * 3600) elapsedSec += 86400;
      if (elapsedSec > 12 * 3600) elapsedSec -= 86400;
    }

    const scheduleEl = document.getElementById('scheduleList');
    scheduleEl.innerHTML = '';

    let cursorMins = list.wakeMins;
    let cursorSec = 0;
    let activeIdx = -1;
    let remainingSec = 0;

    list.tasks.forEach((task, idx) => {
      const startSec = cursorSec;
      const durSec = Number(task.mins) * 60;
      const endSec = startSec + durSec;

      const isActive = elapsedSec >= startSec && elapsedSec < endSec;
      const isDone = elapsedSec >= endSec;

      if (isActive) {
        activeIdx = idx;
        remainingSec = endSec - elapsedSec;
      }

      const row = document.createElement('div');
      row.className = 'task-row' + (isActive ? ' active' : isDone ? ' done' : '');
      row.innerHTML = `
        <span class="task-name">${task.name}</span>
        <span class="task-mins">${task.mins}</span>
        <span class="task-start">${format12Hour(cursorMins)}</span>
      `;
      row.onclick = () => announceTask(task.name, task.mins);
      scheduleEl.appendChild(row);

      cursorMins += Number(task.mins);
      cursorSec = endSec;
    });

    const totalSec = cursorSec;
    const focusStatus = document.getElementById('focusStatus');
    const focusName = document.getElementById('focusTaskName');
    const focusTimer = document.getElementById('focusCountdown');

    if (elapsedSec < 0) {
      const waitSec = Math.abs(elapsedSec);
      const wm = Math.floor(waitSec / 60);
      const ws = String(waitSec % 60).padStart(2, '0');
      focusStatus.textContent = '距離起床開始';
      focusName.textContent = list.tasks[0] ? list.tasks[0].name : '準備開始';
      focusTimer.textContent = `-${wm}:${ws}`;
    } else if (activeIdx !== -1) {
      const currentTask = list.tasks[activeIdx];
      const rm = Math.floor(remainingSec / 60);
      const rs = String(remainingSec % 60).padStart(2, '0');
      focusStatus.textContent = `正在進行 (${activeIdx + 1}/${list.tasks.length})`;
      focusName.textContent = currentTask.name;
      focusTimer.textContent = `${rm}:${rs}`;

      const announceKey = `${list.id}-${activeIdx}`;
      if (state.lastAnnouncedKey !== announceKey) {
        state.lastAnnouncedKey = announceKey;
        announceTask(currentTask.name, currentTask.mins);
      }
    } else {
      focusStatus.textContent = '全部完成';
      focusName.textContent = '出門時間到';
      focusTimer.textContent = format12Hour(list.wakeMins + getTotalMins(list));

      const leaveKey = `${list.id}-leave`;
      if (elapsedSec >= totalSec && elapsedSec < totalSec + 60 && state.lastAnnouncedKey !== leaveKey) {
        state.lastAnnouncedKey = leaveKey;
        announceLeave();
      }
    }
  }

  /* --- List CRUD Editor --- */
  let editingTasks = [];

  function createNewList() {
    const newId = 'list_' + Date.now();
    state.lists.push({
      id: newId,
      name: `清單 ${state.lists.length + 1}`,
      wakeMins: 8 * 60,
      tasks: [
        { name: '刷牙洗面', mins: 5 },
        { name: '吃早餐', mins: 15 },
        { name: '換衫執袋', mins: 10 }
      ]
    });
    state.activeListId = newId;
    saveState();
    renderAll();
    openEditor();
  }

  function openEditor() {
    const list = getActiveList();
    document.getElementById('listNameInput').value = list.name;
    editingTasks = list.tasks.map(t => ({ ...t }));
    renderEditorRows();
    document.getElementById('editorModal').classList.add('open');
  }

  function closeEditor() {
    document.getElementById('editorModal').classList.remove('open');
  }

  function renderEditorRows() {
    const container = document.getElementById('editorRows');
    container.innerHTML = '';
    editingTasks.forEach((task, idx) => {
      const row = document.createElement('div');
      row.className = 'edit-row';
      row.innerHTML = `
        <input class="edit-input" value="${task.name}" onchange="editingTasks[${idx}].name = this.value" />
        <input class="edit-input" type="number" min="1" max="180" value="${task.mins}" onchange="editingTasks[${idx}].mins = Math.max(1, Number(this.value))" />
        <button class="icon-btn" onclick="moveStep(${idx}, -1)">↑</button>
        <button class="icon-btn" onclick="moveStep(${idx}, 1)">↓</button>
        <button class="icon-btn" style="color:#dc2626;" onclick="removeStep(${idx})">✕</button>
      `;
      container.appendChild(row);
    });
  }

  function moveStep(idx, dir) {
    const target = idx + dir;
    if (target < 0 || target >= editingTasks.length) return;
    [editingTasks[idx], editingTasks[target]] = [editingTasks[target], editingTasks[idx]];
    renderEditorRows();
  }

  function removeStep(idx) {
    if (editingTasks.length <= 1) return;
    editingTasks.splice(idx, 1);
    renderEditorRows();
  }

  function addEditorStep() {
    editingTasks.push({ name: '新項目', mins: 5 });
    renderEditorRows();
  }

  function saveEditor() {
    const list = getActiveList();
    const newName = document.getElementById('listNameInput').value.trim();
    if (newName) list.name = newName;
    list.tasks = editingTasks.filter(t => t.name.trim() !== '');
    state.lastAnnouncedKey = null;
    saveState();
    closeEditor();
    renderAll();
  }

  function deleteCurrentList() {
    if (state.lists.length <= 1) {
      alert('最少需要保留一個清單');
      return;
    }
    state.lists = state.lists.filter(l => l.id !== state.activeListId);
    state.activeListId = state.lists[0].id;
    saveState();
    closeEditor();
    renderAll();
  }

  // Init
  applyTheme();
  updateVoiceButton();
  enableWakeLock(false);
  renderAll();
  setInterval(tick, 1000);
</script>
</body>
</html>
