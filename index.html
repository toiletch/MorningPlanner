<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="theme-color" id="themeColorMeta" content="#121614" />
<title>Morning Routine</title>
<style>
  :root {
    --bg: #ebe3d5;
    --card: rgba(255, 255, 255, 0.58);
    --card-border: rgba(58, 46, 34, 0.10);
    --text: #2f251b;
    --muted: rgba(47, 37, 27, 0.58);
    --pill: rgba(47, 37, 27, 0.08);
    --pill-hover: rgba(47, 37, 27, 0.14);
    --accent: #2f251b;
    --accent-text: #ffffff;
    --active-bg: rgba(220, 38, 38, 0.11);
    --active-bar: #dc2626;
    --done-text: rgba(47, 37, 27, 0.36);
  }

  body.theme-sage {
    --bg: #d7e3d4;
    --card: rgba(255, 255, 255, 0.50);
    --card-border: rgba(26, 46, 34, 0.10);
    --text: #1a2e22;
    --muted: rgba(26, 46, 34, 0.60);
    --pill: rgba(26, 46, 34, 0.08);
    --pill-hover: rgba(26, 46, 34, 0.14);
    --accent: #2d5a3f;
    --accent-text: #ffffff;
  }

  body.theme-sky {
    --bg: #d6e4ee;
    --card: rgba(255, 255, 255, 0.52);
    --card-border: rgba(24, 46, 64, 0.10);
    --text: #182e40;
    --muted: rgba(24, 46, 64, 0.60);
    --pill: rgba(24, 46, 64, 0.08);
    --pill-hover: rgba(24, 46, 64, 0.14);
    --accent: #255378;
    --accent-text: #ffffff;
  }

  body.theme-dark {
    --bg: #111312;
    --card: #1c1f1e;
    --card-border: rgba(255, 255, 255, 0.09);
    --text: #f2f4f3;
    --muted: rgba(242, 244, 243, 0.55);
    --pill: rgba(255, 255, 255, 0.09);
    --pill-hover: rgba(255, 255, 255, 0.15);
    --accent: #f2f4f3;
    --accent-text: #111312;
    --active-bg: rgba(239, 68, 68, 0.22);
    --active-bar: #f87171;
    --done-text: rgba(242, 244, 243, 0.34);
  }

  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
    margin: 0;
    padding: 0;
  }

  html {
    background: var(--bg);
    height: 100%;
    width: 100%;
  }

  body {
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    min-height: 100dvh;
    width: 100%;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang HK", "Noto Sans TC", sans-serif;
    transition: background 0.3s ease, color 0.3s ease;
    user-select: none;
    position: fixed;
    inset: 0;
  }

  .app {
    height: 100%;
    width: 100%;
    padding-top: max(10px, env(safe-area-inset-top));
    padding-bottom: max(10px, env(safe-area-inset-bottom));
    padding-left: max(12px, env(safe-area-inset-left));
    padding-right: max(12px, env(safe-area-inset-right));
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .panel {
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 22px;
    padding: 12px 14px;
    display: flex;
    flex-direction: column;
    min-height: 0;
  }

  /* Top Card */
  .top-panel {
    flex-shrink: 0;
    gap: 8px;
  }

  .header-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
  }

  .date-str {
    font-size: 14px;
    font-weight: 700;
    color: var(--muted);
    white-space: nowrap;
  }

  .controls-row {
    display: flex;
    align-items: center;
    gap: 5px;
  }

  .chip {
    background: var(--pill);
    border: 1px solid var(--card-border);
    color: var(--text);
    border-radius: 999px;
    padding: 4px 9px;
    font-size: 11.5px;
    font-weight: 700;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    white-space: nowrap;
  }

  .chip.active {
    background: var(--accent);
    color: var(--accent-text);
    border-color: transparent;
  }

  .chip.wake-active {
    background: rgba(234, 179, 8, 0.20);
    border-color: rgba(234, 179, 8, 0.40);
  }

  .clock-row {
    display: flex;
    align-items: baseline;
    gap: 6px;
  }

  .clock-digits {
    font-size: 38px;
    font-weight: 800;
    line-height: 1;
    letter-spacing: -1px;
    font-variant-numeric: tabular-nums;
  }

  .clock-ampm {
    font-size: 13px;
    font-weight: 700;
    color: var(--muted);
    letter-spacing: 0.5px;
  }

  /* Red Status Card */
  .status-card {
    background: var(--active-bg);
    border-left: 4px solid var(--active-bar);
    border-radius: 14px;
    padding: 9px 12px;
    display: flex;
    flex-direction: column;
    gap: 3px;
  }

  .status-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 11.5px;
    font-weight: 700;
    color: var(--active-bar);
  }

  .status-dot {
    display: inline-block;
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--active-bar);
    margin-right: 4px;
  }

  .status-range {
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }

  .status-title {
    font-size: 20px;
    font-weight: 800;
    line-height: 1.2;
  }

  .status-bottom {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-top: 1px;
  }

  .status-rem {
    font-size: 16px;
    font-weight: 800;
    color: var(--active-bar);
    font-variant-numeric: tabular-nums;
  }

  .status-next {
    font-size: 12px;
    font-weight: 600;
    color: var(--muted);
  }

  .progress-track {
    width: 100%;
    height: 4px;
    background: rgba(128, 128, 128, 0.22);
    border-radius: 99px;
    overflow: hidden;
    margin-top: 4px;
  }

  .progress-fill {
    height: 100%;
    background: var(--active-bar);
    width: 0%;
    transition: width 0.4s linear;
  }

  /* Wake Row & Buttons */
  .wake-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding-top: 2px;
  }

  .wake-label {
    font-size: 14px;
    font-weight: 700;
  }

  .time-pill {
    background: var(--pill);
    border: 1px solid var(--card-border);
    color: var(--text);
    border-radius: 10px;
    padding: 4px 10px;
    font-size: 15px;
    font-weight: 800;
    font-family: inherit;
    font-variant-numeric: tabular-nums;
  }

  .action-pair {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }

  .action-btn {
    background: var(--pill);
    border: 1px solid var(--card-border);
    color: var(--text);
    border-radius: 999px;
    padding: 7px 10px;
    font-size: 12.5px;
    font-weight: 700;
    cursor: pointer;
    text-align: center;
  }

  /* Bottom Card: Schedule */
  .bottom-panel {
    flex: 1;
    min-height: 0;
    justify-content: space-between;
    gap: 4px;
  }

  .list-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
    flex-shrink: 0;
  }

  .tabs-scroll {
    display: flex;
    align-items: center;
    gap: 5px;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .tabs-scroll::-webkit-scrollbar { display: none; }

  .col-headers {
    display: grid;
    grid-template-columns: 1fr 48px 78px;
    font-size: 11px;
    font-weight: 700;
    color: var(--muted);
    padding: 2px 8px;
    border-bottom: 1px solid var(--card-border);
    flex-shrink: 0;
  }
  .col-headers span:nth-child(2),
  .col-headers span:nth-child(3) {
    text-align: right;
  }

  .rows-wrap {
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }

  .task-row {
    display: grid;
    grid-template-columns: 1fr 48px 78px;
    align-items: center;
    padding: 0 8px;
    border-radius: 8px;
    border-left: 3.5px solid transparent;
    font-size: 13.5px;
    font-weight: 600;
    flex: 1;
    min-height: 0;
    cursor: pointer;
  }

  .task-row.done {
    color: var(--done-text);
  }

  .task-row.done .task-title-text {
    text-decoration: line-through;
  }

  .task-row.active {
    background: var(--active-bg);
    border-left-color: var(--active-bar);
    color: var(--active-bar);
    font-weight: 800;
  }

  .task-name-cell {
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    padding-right: 6px;
  }

  .task-mins-cell, .task-time-cell {
    text-align: right;
    font-variant-numeric: tabular-nums;
  }

  .task-mins-cell {
    font-size: 12.5px;
    color: var(--muted);
  }
  .task-row.active .task-mins-cell {
    color: var(--active-bar);
  }

  .leave-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding-top: 5px;
    border-top: 1px solid var(--card-border);
    flex-shrink: 0;
  }

  .leave-left {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 14px;
    font-weight: 800;
  }

  .total-badge {
    background: var(--pill);
    color: var(--muted);
    font-size: 11px;
    font-weight: 700;
    padding: 2px 8px;
    border-radius: 999px;
  }

  /* iPad Landscape Split */
  @media (min-width: 768px) {
    .app {
      display: grid;
      grid-template-columns: 38% 1fr;
      gap: 14px;
      padding: max(16px, env(safe-area-inset-top)) max(18px, env(safe-area-inset-right)) max(16px, env(safe-area-inset-bottom)) max(18px, env(safe-area-inset-left));
    }
    .top-panel {
      justify-content: space-between;
    }
    .clock-digits { font-size: 56px; }
  }

  /* Modal */
  .modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.55);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 16px;
    z-index: 50;
  }
  .modal-backdrop.open { display: flex; }

  .modal {
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--card-border);
    border-radius: 20px;
    width: 100%;
    max-width: 440px;
    max-height: 82dvh;
    display: flex;
    flex-direction: column;
    padding: 16px;
    gap: 10px;
  }

  .modal-body {
    flex: 1;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 7px;
  }

  .edit-row {
    display: grid;
    grid-template-columns: 1fr 58px 28px 28px 28px;
    gap: 4px;
  }

  .edit-input {
    background: var(--card);
    border: 1px solid var(--card-border);
    color: var(--text);
    border-radius: 8px;
    padding: 6px 8px;
    font-size: 13px;
    font-family: inherit;
    width: 100%;
  }

  .icon-btn {
    background: var(--pill);
    border: none;
    color: var(--text);
    border-radius: 6px;
    height: 28px;
    font-weight: 700;
  }
</style>
</head>
<body class="theme-dark">
<div class="app">
  <!-- Top Panel -->
  <div class="panel top-panel">
    <div class="header-row">
      <span class="date-str" id="dateStr">--</span>
      <div class="controls-row">
        <button class="chip active" id="voiceBtn" onclick="toggleVoice()">🔊 粵語提示: 開</button>
        <button class="chip" onclick="testVoice()">🔔 試聽</button>
        <button class="chip" onclick="cycleTheme()">🎨</button>
        <button class="chip wake-active" id="wakeBtn" onclick="requestWake(true)">🔆</button>
      </div>
    </div>

    <div class="clock-row">
      <span class="clock-digits" id="clockDigits">8:58:45</span>
      <span class="clock-ampm" id="clockAmpm">AM · LIVE</span>
    </div>

    <div class="status-card">
      <div class="status-top">
        <span><span class="status-dot"></span><span id="statusStepLabel">現在應該做 (1/10)</span></span>
        <span class="status-range" id="statusRange">--</span>
      </div>
      <div class="status-title" id="statusTaskTitle">準備開始</div>
      <div class="status-bottom">
        <span class="status-rem" id="statusRem">剩餘 --:--</span>
        <span class="status-next" id="statusNext">下一步: --</span>
      </div>
      <div class="progress-track">
        <div class="progress-fill" id="progressFill"></div>
      </div>
    </div>

    <div class="wake-row">
      <span class="wake-label">起床時間</span>
      <input type="time" id="wakeInput" class="time-pill" onchange="onWakeChange()" />
    </div>

    <div class="action-pair">
      <button class="action-btn" onclick="startNow()">▶ 立即開始</button>
      <button class="action-btn" onclick="runDemo()">⚡ 預覽進行中</button>
    </div>
  </div>

  <!-- Bottom Panel -->
  <div class="panel bottom-panel">
    <div class="list-bar">
      <div class="tabs-scroll" id="listTabs"></div>
      <button class="chip" onclick="openEditor()">✏️ 編輯清單</button>
    </div>

    <div class="col-headers">
      <span>項目</span>
      <span>Mins</span>
      <span>計劃開始</span>
    </div>

    <div class="rows-wrap" id="rowsWrap"></div>

    <div class="leave-row">
      <div class="leave-left">
        <span>出門時間</span>
        <span class="total-badge" id="totalBadge">總計 42 分鐘</span>
      </div>
      <input type="time" id="leaveInput" class="time-pill" onchange="onLeaveChange()" />
    </div>
  </div>
</div>

<!-- Modal -->
<div class="modal-backdrop" id="editorModal">
  <div class="modal">
    <div style="display:flex;justify-content:space-between;align-items:center;font-weight:800;">
      <span>編輯清單</span>
      <button class="chip" onclick="closeEditor()">✕ 關閉</button>
    </div>
    <div style="display:flex;gap:6px;">
      <input type="text" id="listNameInput" class="edit-input" />
      <button class="chip" onclick="deleteList()" style="color:#dc2626;">🗑 刪除</button>
    </div>
    <div class="modal-body" id="editorRows"></div>
    <div style="display:flex;justify-content:space-between;">
      <button class="chip" onclick="addStep()">+ 新增項目</button>
      <button class="chip active" onclick="saveEditor()">✓ 儲存</button>
    </div>
  </div>
</div>

<script>
  const DEFAULT_LISTS = [
    {
      id: 'weekday',
      name: '平日',
      wakeMins: 8 * 60 + 28,
      tasks: [
        { name: '小便', mins: 3 },
        { name: '刷牙', mins: 3 },
        { name: '洗面', mins: 2 },
        { name: '磅重 + Apple Watch 充電', mins: 2 },
        { name: '面部保養 / 梳頭', mins: 3 },
        { name: '選擇衣服', mins: 3 },
        { name: '吃早餐', mins: 15 },
        { name: '著衣服', mins: 4 },
        { name: '執袋', mins: 4 },
        { name: '著鞋', mins: 3 }
      ]
    },
    {
      id: 'weekend',
      name: '週末',
      wakeMins: 9 * 60,
      tasks: [
        { name: '小便 + 磅重', mins: 3 },
        { name: '刷牙洗面', mins: 5 },
        { name: '面部保養', mins: 4 },
        { name: '慢享早餐 + 咖啡', mins: 25 },
        { name: '換外出服', mins: 5 },
        { name: '執袋 + 著鞋', mins: 5 }
      ]
    }
  ];

  const THEMES = [
    { cls: 'theme-dark', color: '#111312' },
    { cls: '', color: '#ebe3d5' },
    { cls: 'theme-sage', color: '#d7e3d4' },
    { cls: 'theme-sky', color: '#d6e4ee' }
  ];

  let state = {
    lists: JSON.parse(localStorage.getItem('rt_lists_v3')) || DEFAULT_LISTS,
    activeId: localStorage.getItem('rt_active_v3') || 'weekday',
    themeIdx: Number(localStorage.getItem('rt_theme_v3') || 0),
    voiceOn: localStorage.getItem('rt_voice_v3') === null ? true : localStorage.getItem('rt_voice_v3') === 'true',
    demoSec: null,
    lastSpokenKey: null
  };

  let wakeLock = null;
  let audioCtx = null;

  function save() {
    localStorage.setItem('rt_lists_v3', JSON.stringify(state.lists));
    localStorage.setItem('rt_active_v3', state.activeId);
    localStorage.setItem('rt_theme_v3', state.themeIdx);
    localStorage.setItem('rt_voice_v3', state.voiceOn);
  }

  function currentList() {
    return state.lists.find(l => l.id === state.activeId) || state.lists[0];
  }

  /* Wake Lock + Silent Audio Unlock */
  async function requestWake(fromTap = false) {
    const btn = document.getElementById('wakeBtn');
    try {
      if ('wakeLock' in navigator) {
        wakeLock = await navigator.wakeLock.request('screen');
        btn.classList.add('wake-active');
        wakeLock.addEventListener('release', () => btn.classList.remove('wake-active'));
      }
    } catch (e) {}

    if (fromTap) {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
      } catch (e) {}
    }
  }

  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') requestWake(false);
  });
  document.addEventListener('touchstart', () => requestWake(true), { once: true });

  /* Theme + iOS Status Bar Color Sync */
  function applyTheme() {
    const t = THEMES[state.themeIdx] || THEMES[0];
    document.body.className = t.cls;
    document.documentElement.style.background = t.color;
    const meta = document.getElementById('themeColorMeta');
    if (meta) meta.setAttribute('content', t.color);
  }

  function cycleTheme() {
    state.themeIdx = (state.themeIdx + 1) % THEMES.length;
    save();
    applyTheme();
  }

  /* Time Utilities */
  function minsToInput(m) {
    const v = ((m % 1440) + 1440) % 1440;
    return `${String(Math.floor(v / 60)).padStart(2, '0')}:${String(v % 60).padStart(2, '0')}`;
  }

  function inputToMins(str) {
    if (!str) return 0;
    const [h, m] = str.split(':').map(Number);
    return h * 60 + m;
  }

  function fmt12(m) {
    const v = ((m % 1440) + 1440) % 1440;
    let h = Math.floor(v / 60);
    const min = String(v % 60).padStart(2, '0');
    const ap = h >= 12 ? 'PM' : 'AM';
    h = h % 12 || 12;
    return `${h}:${min} ${ap}`;
  }

  function totalMins(list) {
    return list.tasks.reduce((s, t) => s + Number(t.mins || 0), 0);
  }

  function onWakeChange() {
    state.demoSec = null;
    state.lastSpokenKey = null;
    const l = currentList();
    l.wakeMins = inputToMins(document.getElementById('wakeInput').value);
    save();
    render();
  }

  function onLeaveChange() {
    state.demoSec = null;
    state.lastSpokenKey = null;
    const l = currentList();
    const leave = inputToMins(document.getElementById('leaveInput').value);
    l.wakeMins = ((leave - totalMins(l)) % 1440 + 1440) % 1440;
    save();
    render();
  }

  function startNow() {
    state.demoSec = null;
    state.lastSpokenKey = null;
    const now = new Date();
    const l = currentList();
    l.wakeMins = now.getHours() * 60 + now.getMinutes();
    save();
    render();
  }

  function runDemo() {
    state.demoSec = 16 * 60 + 45; // Highlights item 7 (吃早餐)
    state.lastSpokenKey = null;
    render();
  }

  /* Chime + Cantonese Speech (No 預備/預計) */
  function playChime() {
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const now = audioCtx.currentTime;
      [587.33, 880].forEach((freq, i) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.frequency.setValueAtTime(freq, now + i * 0.15);
        gain.gain.setValueAtTime(0.16, now + i * 0.15);
        gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.15 + 0.4);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now + i * 0.15);
        osc.stop(now + i * 0.15 + 0.4);
      });
    } catch (e) {}
  }

  function speakHK(text) {
    if (!state.voiceOn || !('speechSynthesis' in window)) return;
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'zh-HK';
    u.rate = 1.02;
    const v = window.speechSynthesis.getVoices().find(x => x.lang.includes('zh-HK') || x.lang.includes('yue'));
    if (v) u.voice = v;
    window.speechSynthesis.speak(u);
  }

  function announceStep(name, mins) {
    if (!state.voiceOn) return;
    playChime();
    const clean = name.replace(/\//g, '同埋').replace(/\+/g, '同埋');
    setTimeout(() => speakHK(`下一個項目：${clean}，${mins} 分鐘。`), 320);
  }

  function toggleVoice() {
    state.voiceOn = !state.voiceOn;
    save();
    updateVoiceUI();
    if (state.voiceOn) {
      playChime();
      speakHK('粵語提示已開啟。');
    }
  }

  function testVoice() {
    const l = currentList();
    const item = l.tasks[0] || { name: '刷牙', mins: 3 };
    playChime();
    const clean = item.name.replace(/\//g, '同埋').replace(/\+/g, '同埋');
    setTimeout(() => {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(`下一個項目：${clean}，${item.mins} 分鐘。`);
        u.lang = 'zh-HK';
        window.speechSynthesis.speak(u);
      }
    }, 320);
  }

  function updateVoiceUI() {
    const btn = document.getElementById('voiceBtn');
    btn.textContent = state.voiceOn ? '🔊 粵語提示: 開' : '🔇 粵語提示: 關';
    btn.classList.toggle('active', state.voiceOn);
  }

  /* Render */
  function renderTabs() {
    const wrap = document.getElementById('listTabs');
    wrap.innerHTML = '';
    state.lists.forEach(l => {
      const b = document.createElement('button');
      b.className = 'chip' + (l.id === state.activeId ? ' active' : '');
      b.textContent = l.name;
      b.onclick = () => {
        state.activeId = l.id;
        state.demoSec = null;
        state.lastSpokenKey = null;
        save();
        render();
      };
      wrap.appendChild(b);
    });
    const add = document.createElement('button');
    add.className = 'chip';
    add.textContent = '+ 新增清單';
    add.onclick = createList;
    wrap.appendChild(add);
  }

  function render() {
    const l = currentList();
    const tot = totalMins(l);
    document.getElementById('wakeInput').value = minsToInput(l.wakeMins);
    document.getElementById('leaveInput').value = minsToInput(l.wakeMins + tot);
    document.getElementById('totalBadge').textContent = `總計 ${tot} 分鐘`;
    renderTabs();
    tick();
  }

  function tick() {
    const now = new Date();
    const days = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
    const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
    document.getElementById('dateStr').textContent = `${days[now.getDay()]}, ${months[now.getMonth()]} ${now.getDate()}`;

    let h = now.getHours();
    const ap = h >= 12 ? 'PM' : 'AM';
    h = h % 12 || 12;
    const mm = String(now.getMinutes()).padStart(2, '0');
    const ss = String(now.getSeconds()).padStart(2, '0');
    document.getElementById('clockDigits').textContent = `${h}:${mm}:${ss}`;
    document.getElementById('clockAmpm').textContent = `${ap} · LIVE`;

    const l = currentList();
    const wakeSec = l.wakeMins * 60;
    const nowSec = now.getHours() * 3600 + now.getMinutes() * 60 + now.getSeconds();
    let elapsed = state.demoSec !== null ? state.demoSec : nowSec - wakeSec;
    if (state.demoSec === null) {
      if (elapsed < -43200) elapsed += 86400;
      if (elapsed > 43200) elapsed -= 86400;
    }

    const wrap = document.getElementById('rowsWrap');
    wrap.innerHTML = '';

    let curMins = l.wakeMins;
    let curSec = 0;
    let activeIdx = -1;
    let remSec = 0;
    let durSecActive = 1;
    let activeRange = '';

    l.tasks.forEach((t, idx) => {
      const sSec = curSec;
      const dSec = Number(t.mins) * 60;
      const eSec = sSec + dSec;
      const isAct = elapsed >= sSec && elapsed < eSec;
      const isDone = elapsed >= eSec;

      if (isAct) {
        activeIdx = idx;
        remSec = eSec - elapsed;
        durSecActive = dSec;
        activeRange = `${fmt12(curMins)} - ${fmt12(curMins + Number(t.mins))}`;
      }

      const row = document.createElement('div');
      row.className = 'task-row' + (isAct ? ' active' : isDone ? ' done' : '');
      const prefix = isDone ? '✓ ' : isAct ? '▶ ' : '';
      row.innerHTML = `
        <span class="task-name-cell">${prefix}<span class="task-title-text">${t.name}</span></span>
        <span class="task-mins-cell">${t.mins}</span>
        <span class="task-time-cell">${fmt12(curMins)}</span>
      `;
      row.onclick = () => announceStep(t.name, t.mins);
      wrap.appendChild(row);

      curMins += Number(t.mins);
      curSec = eSec;
    });

    const stepLbl = document.getElementById('statusStepLabel');
    const rangeLbl = document.getElementById('statusRange');
    const titleLbl = document.getElementById('statusTaskTitle');
    const remLbl = document.getElementById('statusRem');
    const nextLbl = document.getElementById('statusNext');
    const fill = document.getElementById('progressFill');

    if (elapsed < 0) {
      const w = Math.abs(elapsed);
      stepLbl.textContent = `尚未開始 (共 ${l.tasks.length} 項)`;
      rangeLbl.textContent = `${fmt12(l.wakeMins)} 開始`;
      titleLbl.textContent = l.tasks[0] ? l.tasks[0].name : '準備開始';
      remLbl.textContent = `倒數 ${Math.floor(w / 60)}:${String(w % 60).padStart(2, '0')}`;
      nextLbl.textContent = `出門: ${fmt12(l.wakeMins + totalMins(l))}`;
      fill.style.width = '0%';
    } else if (activeIdx !== -1) {
      const curTask = l.tasks[activeIdx];
      const nextTask = l.tasks[activeIdx + 1];
      const nextStartMins = l.wakeMins + l.tasks.slice(0, activeIdx + 1).reduce((s, x) => s + Number(x.mins), 0);

      stepLbl.textContent = `現在應該做 (${activeIdx + 1}/${l.tasks.length})`;
      rangeLbl.textContent = activeRange;
      titleLbl.textContent = curTask.name;
      remLbl.textContent = `剩餘 ${String(Math.floor(remSec / 60)).padStart(2, '0')}:${String(remSec % 60).padStart(2, '0')}`;
      nextLbl.textContent = nextTask ? `下一步: ${nextTask.name} (${fmt12(nextStartMins)})` : `下一步: 出門 (${fmt12(nextStartMins)})`;
      fill.style.width = `${Math.min(100, Math.max(0, ((durSecActive - remSec) / durSecActive) * 100))}%`;

      const key = `${l.id}-${activeIdx}`;
      if (state.lastSpokenKey !== key) {
        state.lastSpokenKey = key;
        announceStep(curTask.name, curTask.mins);
      }
    } else {
      stepLbl.textContent = '全部完成';
      rangeLbl.textContent = fmt12(l.wakeMins + totalMins(l));
      titleLbl.textContent = '夠鐘出門啦！';
      remLbl.textContent = '已完成';
      nextLbl.textContent = '';
      fill.style.width = '100%';
    }
  }

  /* Editor */
  let editBuffer = [];
  function createList() {
    const id = 'l_' + Date.now();
    state.lists.push({
      id,
      name: `清單 ${state.lists.length + 1}`,
      wakeMins: 8 * 60,
      tasks: [{ name: '刷牙洗面', mins: 5 }, { name: '執袋出門', mins: 5 }]
    });
    state.activeId = id;
    save();
    render();
    openEditor();
  }

  function openEditor() {
    const l = currentList();
    document.getElementById('listNameInput').value = l.name;
    editBuffer = l.tasks.map(t => ({ ...t }));
    renderEditRows();
    document.getElementById('editorModal').classList.add('open');
  }

  function closeEditor() {
    document.getElementById('editorModal').classList.remove('open');
  }

  function renderEditRows() {
    const box = document.getElementById('editorRows');
    box.innerHTML = '';
    editBuffer.forEach((t, i) => {
      const r = document.createElement('div');
      r.className = 'edit-row';
      r.innerHTML = `
        <input class="edit-input" value="${t.name}" onchange="editBuffer[${i}].name=this.value" />
        <input class="edit-input" type="number" min="1" max="180" value="${t.mins}" onchange="editBuffer[${i}].mins=Math.max(1,Number(this.value))" />
        <button class="icon-btn" onclick="moveStep(${i},-1)">↑</button>
        <button class="icon-btn" onclick="moveStep(${i},1)">↓</button>
        <button class="icon-btn" style="color:#dc2626;" onclick="delStep(${i})">✕</button>
      `;
      box.appendChild(r);
    });
  }

  function moveStep(i, d) {
    const j = i + d;
    if (j < 0 || j >= editBuffer.length) return;
    [editBuffer[i], editBuffer[j]] = [editBuffer[j], editBuffer[i]];
    renderEditRows();
  }

  function delStep(i) {
    if (editBuffer.length <= 1) return;
    editBuffer.splice(i, 1);
    renderEditRows();
  }

  function addStep() {
    editBuffer.push({ name: '新項目', mins: 5 });
    renderEditRows();
  }

  function saveEditor() {
    const l = currentList();
    const n = document.getElementById('listNameInput').value.trim();
    if (n) l.name = n;
    l.tasks = editBuffer.filter(x => x.name.trim());
    state.lastSpokenKey = null;
    save();
    closeEditor();
    render();
  }

  function deleteList() {
    if (state.lists.length <= 1) return;
    state.lists = state.lists.filter(x => x.id !== state.activeId);
    state.activeId = state.lists[0].id;
    save();
    closeEditor();
    render();
  }

  applyTheme();
  updateVoiceUI();
  requestWake(false);
  render();
  setInterval(tick, 1000);
</script>
</body>
</html>
